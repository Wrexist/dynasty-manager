<!doctype html>
<!-- One Google Play phone screenshot, 1080x1920: caption band + a real app
     capture. Query: ?img=<path relative to this file>&cap=<caption>&sub=<line>.
     Rendered by marketing/play/render-graphics.mjs. -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Oswald; font-weight: 700; src: url(../../../node_modules/@fontsource/oswald/files/oswald-latin-700-normal.woff2); }
  @font-face { font-family: DMSans; font-weight: 500; src: url(../../../node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2); }
  html,body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { background: radial-gradient(ellipse 90% 45% at 50% 0%, #3a2a08 0%, #10131b 60%, #080a10 100%); }
  .cap { position:absolute; top:92px; left:70px; right:70px; text-align:center; }
  h1 { margin:0; font-family:Oswald; font-weight:700; font-size:92px; line-height:1; color:#f4f4f5; text-transform:uppercase; }
  h1 em { font-style:normal; color:#e8ad0c; }
  p { margin:22px 0 0; font-family:DMSans; font-weight:500; font-size:40px; color:#c9c9cf; }
  .shot { position:absolute; left:140px; top:450px; width:800px; border-radius:44px; overflow:hidden;
          box-shadow: 0 0 0 3px rgba(232,173,12,.35), 0 30px 80px rgba(0,0,0,.75); }
  .shot img { display:block; width:800px; }
</style></head><body>
<div class="cap"><h1 id="cap"></h1><p id="sub"></p></div>
<div class="shot"><img id="img"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('cap').innerHTML = (q.get('cap') || '').replace(/\*(.+?)\*/g, '<em>$1</em>');
  document.getElementById('sub').textContent = q.get('sub') || '';
  document.getElementById('img').src = q.get('img');
</script>
</body></html>
