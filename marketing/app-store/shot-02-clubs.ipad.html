<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dynasty Manager — Manage the clubs you love</title>
<link rel="stylesheet" href="_appstore.css" />
</head>
<body>
<div class="shot ipad">
  <div class="glow glow-accent"></div>
  <div class="header">
    <div class="kicker">45 leagues · 37 countries</div>
    <h1>Manage the<br><span class="em">clubs you love</span></h1>
    <p class="lede">Pick from <strong>756 real clubs</strong> — from the Premier League to Serie A, Brazil and the MLS.</p>
  </div>
  <div class="phone"><div class="frame"><div class="screen"><img class="cap" src="dist/cap-clubs.png" alt=""/><div class="island"></div></div></div></div>
  <div class="pills"><div class="chip chip-gold"><span class="ic"></span>Premier League</div><div class="chip ">La Liga</div><div class="chip ">Serie A</div><div class="chip chip-gold"><span class="ic"></span>Bundesliga</div><div class="chip ">Ligue 1</div><div class="chip ">Brasileirão</div><div class="chip ">MLS</div></div>
</div>
</body>
</html>
