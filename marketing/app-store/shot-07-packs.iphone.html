<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dynasty Manager — Chase the icons</title>
<link rel="stylesheet" href="_appstore.css" />
</head>
<body>
<div class="shot">
  <div class="glow glow-gold"></div>
  <div class="header">
    <div class="kicker">FUT-style player packs</div>
    <h1>Chase<br><span class="em">the icons</span></h1>
    <p class="lede">Open packs, hunt walkouts and pull <strong>rare gold and icon</strong> cards to upgrade your squad.</p>
  </div>
  <div class="phone"><div class="frame"><div class="screen"><img class="cap" src="dist/cap-packs.png" alt=""/><div class="island"></div></div></div></div>
  <div class="callout gold-edge slot-lt"><div class="label">Top tier</div><div class="value gold">RARE GOLD</div></div><div class="callout gold-edge slot-rb"><div class="label">Reveal</div><div class="value gold">Walkout</div></div>
</div>
</body>
</html>
