<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dynasty Manager — Lead your nation</title>
<link rel="stylesheet" href="_appstore.css" />
</head>
<body>
<div class="shot">
  <div class="glow glow-accent"></div>
  <div class="header">
    <div class="kicker">51 nations · 5 confederations</div>
    <h1>Lead<br><span class="em">your nation</span></h1>
    <p class="lede">Take a national-team job alongside your club, pick a 23-man squad and chase the <strong>World Cup</strong>.</p>
  </div>
  <div class="phone"><div class="frame"><div class="screen"><img class="cap" src="dist/cap-national.png" alt=""/><div class="island"></div></div></div></div>
  <div class="callout gold-edge slot-lt"><div class="label">Nations</div><div class="value blue">51</div></div><div class="callout gold-edge slot-rb"><div class="label">Goal</div><div class="value gold">WORLD CUP</div></div>
</div>
</body>
</html>
