<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dynasty Manager — Live every minute</title>
<link rel="stylesheet" href="_appstore.css" />
</head>
<body>
<div class="shot ipad">
  <div class="glow glow-emerald"></div>
  <div class="header">
    <div class="kicker">minute-by-minute match engine</div>
    <h1>Live<br><span class="em">every minute</span></h1>
    <p class="lede">Watch matches unfold with live xG and momentum — change mentality and <strong>turn the game from the touchline</strong>.</p>
  </div>
  <div class="phone"><div class="frame"><div class="screen"><img class="cap" src="dist/cap-live.png" alt=""/><div class="island"></div></div></div></div>
  <div class="callout gold-edge slot-lt"><div class="label"><span class="d" style="background:#22c98a"></span>Live xG</div><div class="value green">0.15</div></div><div class="callout gold-edge slot-rt"><div class="label">Momentum</div><div class="value gold">53%</div></div><div class="callout gold-edge slot-lb"><div class="label">Half-time</div><div class="value blue">Team talk</div></div>
</div>
</body>
</html>
