<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dynasty Manager — Climb every league</title>
<link rel="stylesheet" href="_appstore.css" />
</head>
<body>
<div class="shot ipad">
  <div class="glow glow-gold"></div>
  <div class="header">
    <div class="kicker">promotion · relegation · cups</div>
    <h1>Climb<br><span class="em">every league</span></h1>
    <p class="lede">Battle for the title, European places and survival across <strong>fully simulated pyramids</strong>.</p>
  </div>
  <div class="phone"><div class="frame"><div class="screen"><img class="cap" src="dist/cap-league.png" alt=""/><div class="island"></div></div></div></div>
  <div class="callout gold-edge slot-lt"><div class="label">Title race</div><div class="value gold">Live table</div></div><div class="callout gold-edge slot-rt"><div class="label">Europe</div><div class="value blue">Top 4</div></div><div class="callout gold-edge slot-rb"><div class="label"><span class="d" style="background:#22c98a"></span>Relegation</div><div class="value green">Bottom 3</div></div>
</div>
</body>
</html>
