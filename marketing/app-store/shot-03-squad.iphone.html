<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dynasty Manager — Build your dream squad</title>
<link rel="stylesheet" href="_appstore.css" />
</head>
<body>
<div class="shot">
  <div class="glow glow-gold"></div>
  <div class="header">
    <div class="kicker">real players · real ratings</div>
    <h1>Build your<br><span class="em">dream squad</span></h1>
    <p class="lede">Thousands of <strong>real footballers</strong> with detailed attributes, form, fitness and morale.</p>
  </div>
  <div class="phone"><div class="frame"><div class="screen"><img class="cap" src="dist/cap-squad.png" alt=""/><div class="island"></div></div></div></div>
  <div class="callout  slot-lt"><div class="label">Squad</div><div class="value ">24 players</div></div><div class="callout gold-edge slot-rt"><div class="label">Avg rating</div><div class="value gold">82 OVR</div></div><div class="callout gold-edge slot-rb"><div class="label"><span class="d" style="background:#22c98a"></span>Depth vs league</div><div class="value green">+8</div></div>
</div>
</body>
</html>
