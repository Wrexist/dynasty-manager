<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'DM Sans',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c1018"/><stop offset="100%" stop-color="#080b12"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FCD56E"/><stop offset="100%" stop-color="#E8A302"/></linearGradient>
    <linearGradient id="heroBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#009b3a"/><stop offset="100%" stop-color="#009b3a" stop-opacity="0"/></linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="20%" r="60%"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowEm" cx="50%" cy="20%" r="60%"><stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowAmb" cx="50%" cy="20%" r="60%"><stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="20%" r="60%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Brazil flag glyph reusable -->
  <defs>
    <g id="br"><rect width="40" height="40" rx="6" fill="#009b3a"/><path d="M20 4 L36 20 L20 36 L4 20 Z" fill="#ffdf00"/><circle cx="20" cy="20" r="8" fill="#002776"/></g>
    <g id="brS"><rect width="16" height="11" rx="1.5" fill="#009b3a"/><path d="M8 1.5 L14 5.5 L8 9.5 L2 5.5 Z" fill="#ffdf00"/><circle cx="8" cy="5.5" r="2.4" fill="#002776"/></g>
  </defs>

  <!-- ===== TopBar (WC tab) ===== -->
  <rect x="0" y="0" width="390" height="56" fill="#0c1018" opacity="0.96"/>
  <line x1="0" y1="56" x2="390" y2="56" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(16 17) scale(0.65)"><use href="#brS"/></g>
  <text x="46" y="27" fill="#EEF1F7" font-size="14" font-weight="700">Brazil</text>
  <text x="46" y="42" fill="#FBBF24" font-size="10" font-weight="600">World Cup · Group Stage</text>
  <!-- inbox + settings -->
  <g transform="translate(322 19)" fill="none" stroke="#8A93A6" stroke-width="1.8"><rect x="0" y="2" width="17" height="13" rx="2"/><path d="M0 4 L8.5 11 L17 4"/></g>
  <circle cx="338" cy="20" r="4" fill="#E11D48"/>
  <g transform="translate(352 11)" fill="none" stroke="#8A93A6" stroke-width="1.8"><circle cx="9" cy="9" r="3"/><path d="M9 1 v3 M9 14 v3 M1 9 h3 M14 9 h3 M3.5 3.5 l2 2 M12.5 12.5 l2 2 M14.5 3.5 l-2 2 M5.5 12.5 l-2 2"/></g>

  <!-- ===== Nation identity hero ===== -->
  <g transform="translate(16 70)">
    <rect width="358" height="4" rx="2" fill="url(#heroBar)"/>
    <g transform="translate(0 14)">
      <g transform="translate(0 2) scale(0.75)"><use href="#brS"/></g>
      <text x="34" y="9" fill="#F4F6FB" font-size="18" font-weight="800" font-family="'Oswald',Arial">Brazil</text>
      <text x="34" y="24" fill="#8A93A6" font-size="10">World Cup · Group Stage</text>
      <text x="358" y="6" text-anchor="end" fill="#8A93A6" font-size="9" letter-spacing="1">SQUAD</text>
      <text x="358" y="24" text-anchor="end" fill="#34D399" font-size="20" font-weight="800" font-family="'Oswald',Arial">84</text>
    </g>
    <!-- phase ladder Groups → Final -->
    <g transform="translate(0 52)">
      <rect x="0"   width="64" height="6" rx="3" fill="#EAB308"/>
      <rect x="73"  width="64" height="6" rx="3" fill="#2b3445"/>
      <rect x="146" width="64" height="6" rx="3" fill="#2b3445"/>
      <rect x="219" width="64" height="6" rx="3" fill="#2b3445"/>
      <rect x="292" width="66" height="6" rx="3" fill="#2b3445"/>
      <g font-size="9" font-weight="600" text-anchor="middle">
        <text x="32"  y="22" fill="#EAB308">Groups</text>
        <text x="105" y="22" fill="#5b6678">R16</text>
        <text x="178" y="22" fill="#5b6678">QF</text>
        <text x="251" y="22" fill="#5b6678">SF</text>
        <text x="325" y="22" fill="#5b6678">Final</text>
      </g>
    </g>
  </g>

  <!-- ===== Next Match card ===== -->
  <g transform="translate(16 168)">
    <rect width="358" height="186" rx="18" fill="#141b27" fill-opacity="0.82" stroke="#EAB30855"/>
    <rect width="358" height="93" rx="18" fill="#ffffff" fill-opacity="0.03"/>
    <!-- badge pill -->
    <g transform="translate(118 20)">
      <rect width="92" height="22" rx="11" fill="#EAB308" fill-opacity="0.12" stroke="#EAB30855"/>
      <path d="M12 6 h8 v3 q0 6 -4 7 q-4 -1 -4 -7 Z" fill="#F5C518"/>
      <text x="52" y="15" text-anchor="middle" fill="#F5C518" font-size="10" font-weight="700" letter-spacing="1">WORLD CUP</text>
    </g>
    <text x="225" y="35" fill="#8A93A6" font-size="10">Group Stage · Group G</text>

    <!-- crests -->
    <g transform="translate(56 56)">
      <circle cx="20" cy="20" r="22" fill="#009b3a" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
      <g transform="translate(4 4) scale(0.8)"><use href="#br"/></g>
      <text x="20" y="60" text-anchor="middle" fill="#F4F6FB" font-size="13" font-weight="700">Brazil</text>
      <text x="20" y="74" text-anchor="middle" fill="#8A93A6" font-size="9" letter-spacing="1">HOME</text>
    </g>
    <text x="179" y="84" text-anchor="middle" fill="#5b6678" font-size="26" font-weight="900" font-family="'Oswald',Arial">VS</text>
    <g transform="translate(246 56)">
      <circle cx="20" cy="20" r="22" fill="#C6363C" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
      <clipPath id="cc"><circle cx="20" cy="20" r="20"/></clipPath>
      <g clip-path="url(#cc)"><rect y="0" width="40" height="13" x="0" fill="#C6363C"/><rect y="13" width="40" height="14" x="0" fill="#0C4076"/><rect y="27" width="40" height="13" x="0" fill="#ffffff"/></g>
      <text x="20" y="60" text-anchor="middle" fill="#F4F6FB" font-size="13" font-weight="700">Serbia</text>
      <text x="20" y="74" text-anchor="middle" fill="#8A93A6" font-size="9" letter-spacing="1">AWAY</text>
    </g>

    <!-- Play button -->
    <g transform="translate(16 152)">
      <rect width="326" height="46" rx="12" fill="url(#gold)"/>
      <path d="M150 14 l12 9 l-12 9 Z" fill="#3a2a05"/>
      <text x="172" y="29" fill="#3a2a05" font-size="15" font-weight="800">Play Match</text>
    </g>
  </g>

  <!-- ===== Quick links (4-up) ===== -->
  <g transform="translate(16 372)">
    <!-- Squad -->
    <g transform="translate(0 0)">
      <rect width="80" height="74" rx="14" fill="#141b27" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="80" height="40" rx="14" fill="url(#glowBlue)"/>
      <rect x="24" y="14" width="32" height="24" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f655"/>
      <g transform="translate(33 22)" stroke="#60A5FA" stroke-width="2" fill="none"><circle cx="4" cy="3" r="2.6"/><circle cx="11" cy="3" r="2.6"/></g>
      <text x="40" y="58" text-anchor="middle" fill="#E7EAF0" font-size="11" font-weight="600">Squad</text>
    </g>
    <!-- Tactics -->
    <g transform="translate(92 0)">
      <rect width="80" height="74" rx="14" fill="#141b27" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="80" height="40" rx="14" fill="url(#glowEm)"/>
      <rect x="24" y="14" width="32" height="24" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b98155"/>
      <g transform="translate(40 26)" stroke="#34D399" stroke-width="2" fill="none"><circle r="6"/><circle r="1.6" fill="#34D399" stroke="none"/></g>
      <text x="40" y="58" text-anchor="middle" fill="#E7EAF0" font-size="11" font-weight="600">Tactics</text>
    </g>
    <!-- Bracket -->
    <g transform="translate(184 0)">
      <rect width="80" height="74" rx="14" fill="#141b27" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="80" height="40" rx="14" fill="url(#glowAmb)"/>
      <rect x="24" y="14" width="32" height="24" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b55"/>
      <path d="M34 20 h8 v3 q0 6 -4 7 q-4 -1 -4 -7 Z" fill="#FBBF24"/>
      <text x="40" y="58" text-anchor="middle" fill="#E7EAF0" font-size="11" font-weight="600">Bracket</text>
    </g>
    <!-- Inbox -->
    <g transform="translate(276 0)">
      <rect width="80" height="74" rx="14" fill="#141b27" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="80" height="40" rx="14" fill="url(#glowCyan)"/>
      <rect x="24" y="14" width="32" height="24" rx="8" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d455"/>
      <g transform="translate(33 21)" fill="none" stroke="#22D3EE" stroke-width="1.8"><rect x="0" y="1" width="14" height="11" rx="2"/><path d="M0 3 L7 8 L14 3"/></g>
      <circle cx="66" cy="12" r="8" fill="#06b6d4"/><text x="66" y="15.5" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">3</text>
      <text x="40" y="58" text-anchor="middle" fill="#E7EAF0" font-size="11" font-weight="600">Inbox</text>
    </g>
  </g>

  <!-- ===== Group standings ===== -->
  <g transform="translate(16 464)">
    <rect width="358" height="190" rx="18" fill="#141b27" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="26" fill="#E7EAF0" font-size="11" font-weight="700" letter-spacing="1">⚑ GROUP G</text>
    <text x="342" y="26" text-anchor="end" fill="#F5C518" font-size="10">Full bracket ›</text>
    <line x1="0" y1="36" x2="358" y2="36" stroke="#ffffff" stroke-opacity="0.08"/>
    <g fill="#8A93A6" font-size="10"><text x="40" y="54">Team</text><text x="250" y="54" text-anchor="middle">P</text><text x="280" y="54" text-anchor="middle">W</text><text x="312" y="54" text-anchor="middle">GD</text><text x="342" y="54" text-anchor="middle" font-weight="700">Pts</text></g>

    <rect x="8" y="62" width="342" height="26" rx="4" fill="#EAB308" fill-opacity="0.06"/>
    <rect x="8" y="62" width="2.5" height="26" fill="#34D399"/>
    <g transform="translate(20 79)"><g transform="scale(0.62)"><use href="#brS"/></g><text x="16" y="0" fill="#FFFFFF" font-size="12" font-weight="700">Brazil</text></g>
    <g fill="#C7CDDA" font-size="12"><text x="250" y="79" text-anchor="middle">2</text><text x="280" y="79" text-anchor="middle">2</text><text x="312" y="79" text-anchor="middle">+4</text></g><text x="342" y="79" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">6</text>

    <rect x="8" y="90" width="2.5" height="26" fill="#34D399"/>
    <g transform="translate(20 107)"><rect width="16" height="11" rx="1.5" y="-9" fill="#D52B1E"/><rect x="6.5" y="-9" width="3" height="11" fill="#fff"/><rect x="4" y="-6" width="8" height="3" fill="#fff"/><text x="22" y="0" fill="#D6DBE6" font-size="12">Switzerland</text></g>
    <g fill="#C7CDDA" font-size="12"><text x="250" y="107" text-anchor="middle">2</text><text x="280" y="107" text-anchor="middle">1</text><text x="312" y="107" text-anchor="middle">+1</text></g><text x="342" y="107" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>

    <g transform="translate(20 135)"><rect width="16" height="11" rx="1.5" y="-9" fill="#C6363C"/><rect y="-5.5" width="16" height="3.5" fill="#0C4076"/><rect y="-2" width="16" height="2" fill="#fff"/><text x="22" y="0" fill="#D6DBE6" font-size="12">Serbia</text></g>
    <g fill="#C7CDDA" font-size="12"><text x="250" y="135" text-anchor="middle">2</text><text x="280" y="135" text-anchor="middle">1</text><text x="312" y="135" text-anchor="middle">0</text></g><text x="342" y="135" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>

    <g transform="translate(20 163)"><rect width="16" height="11" rx="1.5" y="-9" fill="#007a3d"/><rect x="5.5" y="-9" width="5" height="11" fill="#ce1126"/><rect x="10.5" y="-9" width="5.5" height="11" fill="#fcd116"/><text x="22" y="0" fill="#D6DBE6" font-size="12">Cameroon</text></g>
    <g fill="#C7CDDA" font-size="12"><text x="250" y="163" text-anchor="middle">2</text><text x="280" y="163" text-anchor="middle">0</text><text x="312" y="163" text-anchor="middle">−5</text></g><text x="342" y="163" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">0</text>
  </g>

  <!-- ===== Bottom nav (WC) ===== -->
  <g transform="translate(20 772)">
    <rect width="350" height="54" rx="27" fill="#11161f" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="6" y="6" width="84" height="42" rx="21" fill="#EAB308" fill-opacity="0.92"/>
    <g transform="translate(48 19)" text-anchor="middle">
      <path d="M-8 4 L0 -4 L8 4 V11 H-8 Z" fill="none" stroke="#2a2102" stroke-width="2" stroke-linejoin="round"/>
      <text x="0" y="25" fill="#2a2102" font-size="10" font-weight="700">Home</text>
    </g>
    <g transform="translate(135 19)" text-anchor="middle" fill="#AEB6C4">
      <circle cx="-4" cy="-1" r="3.2" fill="none" stroke="#AEB6C4" stroke-width="2"/><circle cx="4" cy="-1" r="3.2" fill="none" stroke="#AEB6C4" stroke-width="2"/>
      <text x="0" y="25" font-size="10" font-weight="600">Squad</text>
    </g>
    <g transform="translate(220 19)" text-anchor="middle" fill="#AEB6C4">
      <circle cx="0" cy="-1" r="6" fill="none" stroke="#AEB6C4" stroke-width="2"/><circle cx="0" cy="-1" r="1.6" fill="#AEB6C4"/>
      <text x="0" y="25" font-size="10" font-weight="600">Tactics</text>
    </g>
    <g transform="translate(305 19)" text-anchor="middle" fill="#AEB6C4">
      <g stroke="#AEB6C4" stroke-width="2" stroke-linecap="round"><line x1="-7" y1="-5" x2="7" y2="-5"/><line x1="-7" y1="0" x2="7" y2="0"/><line x1="-7" y1="5" x2="7" y2="5"/></g>
      <text x="0" y="25" font-size="10" font-weight="600">Bracket</text>
    </g>
  </g>
</svg>
