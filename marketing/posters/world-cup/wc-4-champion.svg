<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'DM Sans',Arial,sans-serif">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#1a2236"/><stop offset="55%" stop-color="#0b1120"/><stop offset="100%" stop-color="#070a12"/></radialGradient>
    <radialGradient id="goldGlow4" cx="50%" cy="34%" r="44%"><stop offset="0%" stop-color="#FAB205" stop-opacity="0.45"/><stop offset="60%" stop-color="#FAB205" stop-opacity="0.06"/><stop offset="100%" stop-color="#FAB205" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FCD56E"/><stop offset="100%" stop-color="#E89A02"/></linearGradient>
    <linearGradient id="trophy4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FCD56E"/><stop offset="100%" stop-color="#C9820A"/></linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg4)"/>
  <ellipse cx="195" cy="300" rx="300" ry="280" fill="url(#goldGlow4)"/>

  <!-- top bar -->
  <rect x="20" y="20" width="26" height="24" rx="4" fill="#002395"/><rect x="29" y="20" width="8" height="24" fill="#fff"/><rect x="37" y="20" width="9" height="24" fill="#ED2939"/>
  <text x="56" y="36" fill="#FBBF24" font-size="11" font-weight="600">World Cup · Final Result</text>

  <!-- hero card -->
  <g transform="translate(28 150)">
    <rect width="334" height="360" rx="22" fill="#ffffff0d" stroke="#ffffff1a"/>
    <rect width="334" height="360" rx="22" fill="url(#gold4)" opacity="0.05"/>
    <!-- trophy -->
    <g transform="translate(135 44)">
      <rect width="64" height="64" rx="16" fill="#FBBF2426"/>
      <g transform="translate(14 12) scale(0.18)" fill="url(#trophy4)"><path d="M40 0 H180 V40 Q180 150 110 175 Q40 150 40 40 Z"/><path d="M40 18 H8 Q-6 18 -6 40 Q-6 86 44 92 V70 Q24 66 24 44 H40 Z"/><path d="M180 18 H212 Q226 18 226 40 Q226 86 176 92 V70 Q196 66 196 44 H180 Z"/><rect x="92" y="172" width="36" height="40"/><rect x="58" y="210" width="104" height="22" rx="6"/><rect x="44" y="232" width="132" height="26" rx="7"/></g>
    </g>
    <!-- nation -->
    <g transform="translate(167 138)" text-anchor="middle">
      <rect x="-46" y="-12" width="20" height="15" rx="2" fill="#002395"/><rect x="-40" y="-12" width="7" height="15" fill="#fff"/><rect x="-33" y="-12" width="7" height="15" fill="#ED2939"/>
      <text x="14" y="0" fill="#C7CDDA" font-size="13" font-weight="600">France</text>
    </g>
    <text x="167" y="194" text-anchor="middle" fill="#FCD56E" font-family="'Oswald',Arial" font-size="34" font-weight="800">World Champions!</text>
    <text x="167" y="222" text-anchor="middle" fill="#E7C46A" font-size="12">You conquered the world. A tournament for the ages.</text>

    <!-- run summary chips -->
    <g transform="translate(28 250)" font-size="11" text-anchor="middle">
      <g><rect width="86" height="48" rx="12" fill="#ffffff0a" stroke="#ffffff14"/><text x="43" y="22" fill="#8A93A6" font-size="10">Final</text><text x="43" y="38" fill="#fff" font-weight="700">2 - 1 Spain</text></g>
      <g transform="translate(96 0)"><rect width="86" height="48" rx="12" fill="#ffffff0a" stroke="#ffffff14"/><text x="43" y="22" fill="#8A93A6" font-size="10">Played</text><text x="43" y="38" fill="#fff" font-weight="700">7 · W6 D1</text></g>
      <g transform="translate(192 0)"><rect width="86" height="48" rx="12" fill="#ffffff0a" stroke="#ffffff14"/><text x="43" y="22" fill="#8A93A6" font-size="10">Top scorer</text><text x="43" y="38" fill="#fff" font-weight="700">Mbappé · 6</text></g>
    </g>
  </g>

  <!-- buttons -->
  <g transform="translate(28 540)">
    <rect width="334" height="50" rx="14" fill="url(#gold4)"/>
    <text x="167" y="32" text-anchor="middle" fill="#3a2a05" font-size="14" font-weight="800">↻  Play Another World Cup</text>
  </g>
  <g transform="translate(28 600)">
    <rect width="334" height="50" rx="14" fill="#ffffff10" stroke="#ffffff14"/>
    <text x="167" y="32" text-anchor="middle" fill="#EEF1F7" font-size="14" font-weight="700">⌂  Main Menu</text>
  </g>
</svg>
