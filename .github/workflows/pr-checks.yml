name: PR Checks
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Check bundle size
        run: |
          set -euo pipefail

          if [ ! -d "dist/assets" ]; then
            echo "::error::dist/assets not found — build may have failed"
            exit 1
          fi

          echo "## Bundle Size Report"
          echo ""

          # Total dist size
          TOTAL_SIZE=$(du -sb dist | cut -f1)
          TOTAL_MB=$(awk "BEGIN {printf \"%.2f\", $TOTAL_SIZE / 1048576}")
          echo "Total dist size: ${TOTAL_MB} MB"

          # JS chunk sizes (sorted by size descending)
          echo ""
          echo "| File | Size (KB) |"
          echo "|------|-----------|"
          shopt -s nullglob
          for f in dist/assets/*.js; do
            SIZE=$(wc -c < "$f")
            SIZE_KB=$(awk "BEGIN {printf \"%.1f\", $SIZE / 1024}")
            echo "| $(basename "$f") | ${SIZE_KB} |"
          done | sort -t'|' -k3 -rn

          # Total JS size (all chunks — includes opt-in community pack data)
          JS_TOTAL=$(find dist/assets -name '*.js' -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')
          JS_MB=$(awk "BEGIN {printf \"%.2f\", $JS_TOTAL / 1048576}")
          echo ""
          echo "Total JS: ${JS_MB} MB"

          # Community pack chunks are lazy-loaded only when the user enables
          # the pack at new-game time, so they do not count against the base
          # bundle budget that protects first-load UX.
          CP_TOTAL=$(find dist/assets \( -name 'freeAgents-*.js' -o -name 'byClub-*.js' -o -name 'cpLeagueSquads-*.js' \) -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')
          CP_MB=$(awk "BEGIN {printf \"%.2f\", $CP_TOTAL / 1048576}")
          CORE_JS=$((JS_TOTAL - CP_TOTAL))
          CORE_MB=$(awk "BEGIN {printf \"%.2f\", $CORE_JS / 1048576}")
          echo "Community pack chunks: ${CP_MB} MB (lazy)"
          echo "Core JS (excl. community pack): ${CORE_MB} MB"

          # Budget: fail if core JS (excl. community pack) exceeds 5.5 MB
          if [ "$CORE_JS" -gt 5767168 ]; then
            echo "::error::Core JS bundle size (${CORE_MB} MB) exceeds budget (5.50 MB)"
            exit 1
          fi
          echo "Bundle size OK (core ${CORE_MB} MB, budget: 5.50 MB)"

          # Community pack budget: fail if CP chunks exceed 4.0 MB
          if [ "$CP_TOTAL" -gt 4194304 ]; then
            echo "::error::Community pack chunks (${CP_MB} MB) exceed budget (4.00 MB)"
            exit 1
          fi
          if [ "$CP_TOTAL" -gt 0 ]; then
            echo "Community pack size OK (${CP_MB} MB, budget: 4.00 MB)"
          fi

          # Main chunk budget: fail if largest index-*.js exceeds 1200 KB
          MAIN_JS=$(find dist/assets -name 'index-*.js' -not -name '*.map' -type f -printf '%s %p\n' | sort -rn | head -1 | awk '{print $2}')
          if [ -n "$MAIN_JS" ]; then
            MAIN_SIZE=$(wc -c < "$MAIN_JS")
            MAIN_KB=$(awk "BEGIN {printf \"%.1f\", $MAIN_SIZE / 1024}")
            echo "Main chunk: ${MAIN_KB} KB"
            if [ "$MAIN_SIZE" -gt 1228800 ]; then
              echo "::error::Main chunk (${MAIN_KB} KB) exceeds budget (1200 KB)"
              exit 1
            fi
            echo "Main chunk OK (${MAIN_KB} KB, budget: 1200 KB)"
          fi

  whats-new-check:
    # Catches drift between merged PRs and the in-app release notes. If this
    # PR changes user-visible files but doesn't update src/data/whatsNew.ts,
    # fail + post an actionable comment. Escape hatches exist (labels + an
    # allow-list of non-user-visible paths) so pure-infra PRs don't get
    # nagged. The TestFlight workflow still runs its own stricter validator
    # at build time — this is the earlier line of defence.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Guard What's New freshness
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // ─── Escape hatches ────────────────────────────────────────
            // Authors can opt out when a PR genuinely doesn't need a
            // changelog entry (dep bumps, CI work, pure refactors).
            const SKIP_LABELS = new Set([
              'skip-changelog',
              'no-changelog',
              'dependencies',
              'infra',
              'ci',
            ]);
            const labelNames = (pr.labels || []).map(l => l.name);
            const skipLabel = labelNames.find(n => SKIP_LABELS.has(n));
            if (skipLabel) {
              core.info(`Skipping — \`${skipLabel}\` label is present.`);
              return;
            }
            // Draft PRs are WIP — don't nag yet.
            if (pr.draft) {
              core.info('Skipping — PR is in draft.');
              return;
            }

            // ─── Classify changed files ────────────────────────────────
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );

            const WHATS_NEW_PATH = 'src/data/whatsNew.ts';

            /** User-visible = changes a player can perceive in the built
             *  app. Excludes tests, types-only shims, build tooling, docs,
             *  workflows, scripts, and lockfiles. */
            const isUserVisible = (filename) => {
              if (filename === WHATS_NEW_PATH) return false;
              if (filename.startsWith('src/test/')) return false;
              if (/\.(test|spec)\.(ts|tsx|js|jsx)$/.test(filename)) return false;
              if (filename.startsWith('.github/')) return false;
              if (filename.startsWith('scripts/')) return false;
              if (filename.startsWith('docs/')) return false;
              if (filename.endsWith('.md')) return false;
              if (filename === 'package-lock.json') return false;
              if (filename === 'tsconfig.json' || filename === 'tsconfig.app.json' || filename === 'tsconfig.node.json') return false;
              if (filename === 'eslint.config.js' || filename === 'vitest.config.ts' || filename === 'postcss.config.js' || filename === 'tailwind.config.ts') return false;
              if (filename === '.gitignore' || filename === '.eslintignore' || filename === '.nvmrc') return false;
              // User-visible code + assets + native shells.
              return (
                filename.startsWith('src/') ||
                filename.startsWith('public/') ||
                filename.startsWith('ios/App/App/') ||
                filename.startsWith('android/app/src/main/') ||
                filename === 'capacitor.config.ts' ||
                filename === 'index.html' ||
                filename === 'package.json' || // version bumps
                filename === 'vite.config.ts'
              );
            };

            const relevant = files.filter(
              f => f.status !== 'removed' && isUserVisible(f.filename),
            );
            const whatsNewTouched = files.some(
              f => f.filename === WHATS_NEW_PATH,
            );

            // ─── Decide ────────────────────────────────────────────────
            // Find any prior bot comment so we can update (not spam) it.
            const MARKER = '<!-- whats-new-check -->';
            const existing = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            ).then(cs => cs.find(c => c.body && c.body.includes(MARKER)));

            async function upsertComment(body) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }

            // If there's nothing user-visible, silently pass (and clear
            // any stale failure comment from a previous push).
            if (relevant.length === 0) {
              if (existing) {
                await upsertComment([
                  MARKER,
                  '✅ What\'s New check — no user-visible changes in the latest push, nothing to document.',
                ].join('\n'));
              }
              core.info('No user-visible files changed — nothing to document.');
              return;
            }

            if (whatsNewTouched) {
              if (existing) {
                await upsertComment([
                  MARKER,
                  `✅ What's New updated — thanks! ${relevant.length} user-visible file(s) in this PR.`,
                ].join('\n'));
              }
              core.info(`What's New updated (${relevant.length} user-visible file(s) changed).`);
              return;
            }

            // ─── Fail + post a helpful comment ─────────────────────────
            const sampleFiles = relevant.slice(0, 15)
              .map(f => `- \`${f.filename}\``)
              .join('\n');
            const overflow = relevant.length > 15
              ? `\n- …and ${relevant.length - 15} more`
              : '';

            const body = [
              MARKER,
              `### ⚠️ Missing "What's New" entry`,
              ``,
              `This PR changes **${relevant.length} user-visible file(s)** but doesn't touch \`${WHATS_NEW_PATH}\`. If this ships as-is, players won't see it in the in-app release notes.`,
              ``,
              `#### Fix it with one command`,
              ``,
              '```bash',
              'npm run whats-new -- new      "Short, player-facing description."',
              'npm run whats-new -- improved "Describe an improvement."',
              'npm run whats-new -- fixed    "Describe a user-visible bug fix."',
              'npm run whats-new -- highlight "Marquee change worth calling out."',
              '```',
              ``,
              `The helper automatically appends to the current top entry, or creates a new one if you just bumped \`package.json\`. Run \`npm run whats-new -- show\` to preview.`,
              ``,
              `#### Don't need a changelog entry?`,
              ``,
              `Add one of these labels to bypass: \`skip-changelog\`, \`no-changelog\`, \`dependencies\`, \`infra\`, \`ci\`.`,
              ``,
              `<details><summary>Files that triggered this check (${relevant.length})</summary>`,
              ``,
              sampleFiles + overflow,
              `</details>`,
            ].join('\n');

            await upsertComment(body);
            core.setFailed(
              `What's New not updated. ${relevant.length} user-visible file(s) changed ` +
              `but src/data/whatsNew.ts was not. See PR comment for the one-line fix or ` +
              `add a skip-changelog label if this PR genuinely doesn't need notes.`,
            );

  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Code review summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const stats = {
              added: files.filter(f => f.status === 'added').length,
              modified: files.filter(f => f.status === 'modified').length,
              removed: files.filter(f => f.status === 'removed').length,
              total: files.length,
              additions: files.reduce((sum, f) => sum + f.additions, 0),
              deletions: files.reduce((sum, f) => sum + f.deletions, 0),
            };

            const bigFiles = files
              .filter(f => f.changes > 100)
              .map(f => `| \`${f.filename}\` | +${f.additions} / -${f.deletions} |`)
              .join('\n');

            const body = [
              `## PR Stats`,
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Files changed | ${stats.total} |`,
              `| Files added | ${stats.added} |`,
              `| Files modified | ${stats.modified} |`,
              `| Files removed | ${stats.removed} |`,
              `| Lines added | +${stats.additions} |`,
              `| Lines removed | -${stats.deletions} |`,
              ``,
              bigFiles ? `### Large changes (100+ lines)\n| File | Changes |\n|------|---------|\n${bigFiles}` : '',
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
