name: PR Checks
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Check bundle size
        run: |
          set -euo pipefail

          if [ ! -d "dist/assets" ]; then
            echo "::error::dist/assets not found — build may have failed"
            exit 1
          fi

          echo "## Bundle Size Report"
          echo ""

          # Total dist size
          TOTAL_SIZE=$(du -sb dist | cut -f1)
          TOTAL_MB=$(awk "BEGIN {printf \"%.2f\", $TOTAL_SIZE / 1048576}")
          echo "Total dist size: ${TOTAL_MB} MB"

          # JS chunk sizes (sorted by size descending)
          echo ""
          echo "| File | Size (KB) |"
          echo "|------|-----------|"
          shopt -s nullglob
          for f in dist/assets/*.js; do
            SIZE=$(wc -c < "$f")
            SIZE_KB=$(awk "BEGIN {printf \"%.1f\", $SIZE / 1024}")
            echo "| $(basename "$f") | ${SIZE_KB} |"
          done | sort -t'|' -k3 -rn

          # Total JS size (all chunks — includes opt-in community pack data)
          JS_TOTAL=$(find dist/assets -name '*.js' -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')
          JS_MB=$(awk "BEGIN {printf \"%.2f\", $JS_TOTAL / 1048576}")
          echo ""
          echo "Total JS: ${JS_MB} MB"

          # Community pack chunks are lazy-loaded only when the user enables
          # the pack at new-game time, so they do not count against the base
          # bundle budget that protects first-load UX.
          CP_TOTAL=$(find dist/assets \( -name 'freeAgents-*.js' -o -name 'byClub-*.js' -o -name 'cpLeagueSquads-*.js' \) -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')
          CP_MB=$(awk "BEGIN {printf \"%.2f\", $CP_TOTAL / 1048576}")
          CORE_JS=$((JS_TOTAL - CP_TOTAL))
          CORE_MB=$(awk "BEGIN {printf \"%.2f\", $CORE_JS / 1048576}")
          echo "Community pack chunks: ${CP_MB} MB (lazy)"
          echo "Core JS (excl. community pack): ${CORE_MB} MB"

          # Bundle budget — single source of truth lives in
          # .github/bundle-budget.json (target / hard limit split so
          # incremental UX PRs don't race the same workflow line on
          # every merge). See that file for the rationale + tuning.
          BUDGET_FILE=".github/bundle-budget.json"
          if [ ! -f "$BUDGET_FILE" ]; then
            echo "::error::Missing $BUDGET_FILE"
            exit 1
          fi
          CORE_TARGET=$(jq -r '.coreJsTargetBytes' "$BUDGET_FILE")
          CORE_HARD=$(jq -r '.coreJsHardLimitBytes' "$BUDGET_FILE")
          CP_HARD=$(jq -r '.communityPackHardLimitBytes' "$BUDGET_FILE")
          MAIN_HARD=$(jq -r '.mainChunkHardLimitBytes' "$BUDGET_FILE")
          CORE_TARGET_MB=$(awk "BEGIN {printf \"%.2f\", $CORE_TARGET / 1048576}")
          CORE_HARD_MB=$(awk "BEGIN {printf \"%.2f\", $CORE_HARD / 1048576}")
          CP_HARD_MB=$(awk "BEGIN {printf \"%.2f\", $CP_HARD / 1048576}")
          MAIN_HARD_KB=$(awk "BEGIN {printf \"%.0f\", $MAIN_HARD / 1024}")

          # Core JS — hard limit FAILS CI; target only WARNS. The target
          # is a tripwire that surfaces drift without blocking ordinary
          # UX work; the hard limit is the real cliff.
          if [ "$CORE_JS" -gt "$CORE_HARD" ]; then
            echo "::error::Core JS bundle size (${CORE_MB} MB) exceeds hard limit (${CORE_HARD_MB} MB). Trim the bundle, or — if this represents a deliberate ceiling raise — bump coreJsHardLimitBytes in $BUDGET_FILE with reasoning."
            exit 1
          fi
          if [ "$CORE_JS" -gt "$CORE_TARGET" ]; then
            DELTA_BYTES=$((CORE_JS - CORE_TARGET))
            DELTA_KB=$(awk "BEGIN {printf \"%.1f\", $DELTA_BYTES / 1024}")
            HEADROOM=$((CORE_HARD - CORE_JS))
            HEADROOM_KB=$(awk "BEGIN {printf \"%.0f\", $HEADROOM / 1024}")
            echo "::warning::Core JS ${CORE_MB} MB is ${DELTA_KB} KB over target (${CORE_TARGET_MB} MB). Hard limit ${CORE_HARD_MB} MB has ${HEADROOM_KB} KB headroom. Consider trimming or bumping the target in $BUDGET_FILE."
          else
            HEADROOM=$((CORE_TARGET - CORE_JS))
            HEADROOM_KB=$(awk "BEGIN {printf \"%.0f\", $HEADROOM / 1024}")
            echo "Bundle size OK (core ${CORE_MB} MB, target ${CORE_TARGET_MB} MB, ${HEADROOM_KB} KB under target)."
          fi

          # Community pack — hard limit only.
          if [ "$CP_TOTAL" -gt "$CP_HARD" ]; then
            echo "::error::Community pack chunks (${CP_MB} MB) exceed hard limit (${CP_HARD_MB} MB). Adjust communityPackHardLimitBytes in $BUDGET_FILE if this is intentional."
            exit 1
          fi
          if [ "$CP_TOTAL" -gt 0 ]; then
            echo "Community pack size OK (${CP_MB} MB, hard limit: ${CP_HARD_MB} MB)"
          fi

          # Main chunk — hard limit only.
          MAIN_JS=$(find dist/assets -name 'index-*.js' -not -name '*.map' -type f -printf '%s %p\n' | sort -rn | head -1 | awk '{print $2}')
          if [ -n "$MAIN_JS" ]; then
            MAIN_SIZE=$(wc -c < "$MAIN_JS")
            MAIN_KB=$(awk "BEGIN {printf \"%.1f\", $MAIN_SIZE / 1024}")
            echo "Main chunk: ${MAIN_KB} KB"
            if [ "$MAIN_SIZE" -gt "$MAIN_HARD" ]; then
              echo "::error::Main chunk (${MAIN_KB} KB) exceeds hard limit (${MAIN_HARD_KB} KB). Adjust mainChunkHardLimitBytes in $BUDGET_FILE if intentional."
              exit 1
            fi
            echo "Main chunk OK (${MAIN_KB} KB, hard limit: ${MAIN_HARD_KB} KB)"
          fi

      # First-load (eager) payload budget — complements the on-disk core-JS
      # guard above. Measures the gzipped entry + modulepreload chunks, which
      # is what first-paint UX depends on, and catches a lazy chunk slipping
      # into the boot graph (which the on-disk total cannot see).
      - name: Check eager first-load bundle size
        run: node scripts/check-eager-bundle.mjs

  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Code review summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const stats = {
              added: files.filter(f => f.status === 'added').length,
              modified: files.filter(f => f.status === 'modified').length,
              removed: files.filter(f => f.status === 'removed').length,
              total: files.length,
              additions: files.reduce((sum, f) => sum + f.additions, 0),
              deletions: files.reduce((sum, f) => sum + f.deletions, 0),
            };

            const bigFiles = files
              .filter(f => f.changes > 100)
              .map(f => `| \`${f.filename}\` | +${f.additions} / -${f.deletions} |`)
              .join('\n');

            const body = [
              `## PR Stats`,
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Files changed | ${stats.total} |`,
              `| Files added | ${stats.added} |`,
              `| Files modified | ${stats.modified} |`,
              `| Files removed | ${stats.removed} |`,
              `| Lines added | +${stats.additions} |`,
              `| Lines removed | -${stats.deletions} |`,
              ``,
              bigFiles ? `### Large changes (100+ lines)\n| File | Changes |\n|------|---------|\n${bigFiles}` : '',
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
