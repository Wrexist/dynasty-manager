name: PR Checks
on:
  pull_request:
    branches: [main]

# A new push to the same PR supersedes the run in flight — no point finishing
# a 20-minute suite on a commit nobody will merge.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The whole release gate, by name: lint, typecheck, docs:check,
      # i18n:check, packs:supply, the FULL test suite, build, and every bundle
      # budget in .github/bundle-budget.json (size:check runs
      # scripts/check-eager-bundle.mjs: eager first-load gz, main chunk, core
      # JS, community pack). Calling the npm script rather than repeating its
      # steps here is what keeps CI and a local `npm run preflight:full` from
      # drifting apart — the bundle budgets used to live in an inline shell
      # copy that local preflight never ran.
      - name: Release gate (npm run preflight:full)
        run: npm run preflight:full

  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Code review summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const stats = {
              added: files.filter(f => f.status === 'added').length,
              modified: files.filter(f => f.status === 'modified').length,
              removed: files.filter(f => f.status === 'removed').length,
              total: files.length,
              additions: files.reduce((sum, f) => sum + f.additions, 0),
              deletions: files.reduce((sum, f) => sum + f.deletions, 0),
            };

            const bigFiles = files
              .filter(f => f.changes > 100)
              .map(f => `| \`${f.filename}\` | +${f.additions} / -${f.deletions} |`)
              .join('\n');

            const body = [
              `## PR Stats`,
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Files changed | ${stats.total} |`,
              `| Files added | ${stats.added} |`,
              `| Files modified | ${stats.modified} |`,
              `| Files removed | ${stats.removed} |`,
              `| Lines added | +${stats.additions} |`,
              `| Lines removed | -${stats.deletions} |`,
              ``,
              bigFiles ? `### Large changes (100+ lines)\n| File | Changes |\n|------|---------|\n${bigFiles}` : '',
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
