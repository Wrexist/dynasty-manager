name: iOS TestFlight Deploy
on:
  workflow_dispatch:
    inputs:
      headline:
        description: "Optional: App Store-style hook (3-8 words). Leave blank to auto-generate from the lead merged PR."
        required: false
        type: string
      summary:
        description: "Optional: 1-3 sentence player-facing summary. Leave blank to auto-generate from merged PRs since the last release."
        required: false
        type: string
      since:
        description: "Optional: ISO date (YYYY-MM-DD) to override the merge cutoff. Defaults to the previous shipped entry's date in whatsNew.ts."
        required: false
        type: string

jobs:
  build:
    # macos-26 runner ships Xcode 26.x by default, which carries the iOS 26
    # SDK that Apple requires for App Store uploads (error 90725 — "All iOS
    # apps must be built with iOS 26 SDK or later"). The earlier macos-latest
    # / macos-15 runner defaulted to Xcode 16.x (iOS 18 SDK) which Apple now
    # rejects at upload time. The explicit xcode-select step below is a
    # safety net in case GitHub bumps the runner's default Xcode in future.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
          VITE_REVENUECAT_API_KEY: ${{ secrets.VITE_REVENUECAT_API_KEY }}
        run: |
          missing=0
          check_secret() {
            if [ -z "${!1}" ]; then
              echo "::error::Missing secret: $1 — $2"
              missing=$((missing + 1))
            fi
          }

          echo "Checking required secrets..."

          check_secret "APPLE_TEAM_ID" \
            "Apple Developer Team ID (10-character string)"
          check_secret "ASC_KEY_ID" \
            "App Store Connect API Key ID (create at appstoreconnect.apple.com/access/integrations/api)"
          check_secret "ASC_ISSUER_ID" \
            "App Store Connect Issuer ID (found at appstoreconnect.apple.com/access/integrations/api)"
          check_secret "ASC_KEY_P8" \
            "App Store Connect API private key (.p8 file) content"
          check_secret "MATCH_GIT_URL" \
            "Git URL for fastlane match certificates/profiles repo"
          check_secret "MATCH_PASSWORD" \
            "Password to decrypt fastlane match repo"
          check_secret "MATCH_SSH_PRIVATE_KEY" \
            "SSH private key that can read the match repo"
          # VITE_REVENUECAT_API_KEY is optional — code falls back to a test key when absent
          if [ -z "$VITE_REVENUECAT_API_KEY" ]; then
            echo "::warning::VITE_REVENUECAT_API_KEY not set — build will use the embedded test key. Add your production key at: Settings > Secrets and variables > Actions (RevenueCat > Project > API Keys, starts with appl_)"
          fi

          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing required secret(s) missing. Add them at: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required secrets are configured."

      - uses: actions/checkout@v4
        with:
          # Full history needed by build-whats-new.mjs to (a) find the
          # previous release commit's timestamp for a precise lower bound on
          # the merged-PR query, and (b) read HEAD's commit time as the
          # upper bound so PRs merged after this checkout can't leak into
          # the notes for a build that doesn't contain them.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run test

      # Apple App Store rejects builds compiled with anything below the
      # iOS 26 SDK (error 90725). The runner has multiple Xcode 26.x apps
      # installed; pick the highest stable one explicitly so we don't
      # silently regress to a default that drifts back below 26.
      - name: Select latest stable Xcode (>= 26 for iOS 26 SDK)
        run: |
          set -e
          # Wrap the discovery pipeline in `|| true` because GitHub's bash
          # has `pipefail` enabled — without it, an empty `ls` glob or a
          # grep that filters everything out would abort the step before
          # we get to print our own diagnostic message below.
          XCODE=$( (ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null \
            | grep -v -i beta \
            | sort -V \
            | tail -1) || true )
          if [ -z "$XCODE" ]; then
            echo "::warning::No stable Xcode 26+ found; falling back to the latest beta. The iOS platform may need to be downloaded explicitly."
            XCODE=$( (ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null \
              | sort -V \
              | tail -1) || true )
          fi
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26+ found on the runner. Apple requires iOS 26 SDK for App Store uploads (error 90725)."
            echo "Installed Xcode versions:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          # GitHub macOS runners pre-set DEVELOPER_DIR in the job environment,
          # which takes precedence over `xcode-select` for every subsequent
          # step. Without this GITHUB_ENV line the archive step silently
          # reverts to the runner's default Xcode (often a beta whose iOS
          # platform component is missing — the cause of "iOS 26.5 is not
          # installed" archive failures).
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "iOS SDKs available:"
          xcodebuild -showsdks | grep -i ios || true
          echo "Installed iOS Simulator runtimes:"
          xcrun simctl list runtimes 2>/dev/null | grep -i 'iOS' || echo "(none)"
          # Always (re-)download the iOS platform. This ensures both the
          # iphoneos SDK *and* a simulator runtime matching the SDK version
          # are present. Even when archiving for `generic/platform=iOS`,
          # actool validates simulator runtime availability when compiling
          # asset catalogs — if the runner's pre-installed runtimes lag
          # behind the Xcode SDK (e.g. Xcode 26.5 SDK 23F5054d vs. only
          # iOS 26.4 / 23E254a runtime on disk), archive fails with
          # "No simulator runtime version from [...] available to use with
          # iphonesimulator SDK version <X>". The command is idempotent
          # when the platform is already current.
          echo "Ensuring iOS platform + matching simulator runtime are installed..."
          xcodebuild -downloadPlatform iOS
          echo "iOS Simulator runtimes after download:"
          xcrun simctl list runtimes 2>/dev/null | grep -i 'iOS' || true

      # ─── What's New: auto-generate from merged PRs ─────────────────────
      # Generates the top entry of src/data/whatsNew.ts from PRs merged into
      # main since the previous shipped release. Bullets are pulled from a
      # `## What's New` section in each PR body or the PR title as fallback.
      # Categorisation comes from PR labels: `type:highlight` / `type:new` /
      # `type:improved` / `type:fixed`. PRs labelled `skip-changelog`,
      # `dependencies`, etc. are excluded. The headline + summary are
      # auto-generated from those bullets when the workflow inputs are empty,
      # or used verbatim when supplied for hand-crafted App Store voice.
      # This mutation is scoped to the runner — the repo copy stays as-is.
      - name: Generate What's New entry from merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.headline }}" ]; then
            ARGS+=(--headline "${{ inputs.headline }}")
          fi
          if [ -n "${{ inputs.summary }}" ]; then
            ARGS+=(--summary "${{ inputs.summary }}")
          fi
          if [ -n "${{ inputs.since }}" ]; then
            ARGS+=(--since "${{ inputs.since }}")
          fi
          node scripts/build-whats-new.mjs "${ARGS[@]}"

      # Validates that the generated entry matches package.json.version and
      # has all required fields. Belt-and-braces with build-whats-new.mjs.
      - name: Validate What's New entry
        run: node scripts/check-whats-new.mjs

      # Inject the TestFlight build number (github.run_number) into the top
      # RELEASE_NOTES entry's `build` field before bundling, so the shipped
      # app shows the real CFBundleVersion in its in-app What's New card.
      - name: Inject build number into What's New
        run: node scripts/check-whats-new.mjs --inject-build ${{ github.run_number }}

      - name: Build with production keys
        env:
          VITE_REVENUECAT_API_KEY: ${{ secrets.VITE_REVENUECAT_API_KEY }}
        run: npm run build
      - run: npm run version:sync
      - run: npx cap sync ios

      - name: Strip alpha channel from app icon
        run: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -s format jpeg -s formatOptions 100 "$ICON" --out "$ICON.jpg"
          sips -s format png "$ICON.jpg" --out "$ICON"
          rm -f "$ICON.jpg"
          echo "Alpha channel removed from app icon"

      - name: Set up SSH for Match
        env:
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "$MATCH_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/id_rsa"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          MATCH_HOST=$(echo "${{ secrets.MATCH_GIT_URL }}" | sed -E 's#(ssh://)?([^@]+@)?([^/:]+).*#\3#')
          if [ -z "$MATCH_HOST" ]; then
            echo "::error::Unable to parse host from MATCH_GIT_URL"
            exit 1
          fi
          ssh-keyscan -H "$MATCH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

      - name: Set up App Store Connect API key (Fastlane JSON)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          JSON_PATH="$RUNNER_TEMP/asc_api_key.json"

          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          KEY_PATH="$KEY_PATH" JSON_PATH="$JSON_PATH" python3 - << 'PY'
          import json, os
          key_id = os.environ["ASC_KEY_ID"]
          issuer_id = os.environ["ASC_ISSUER_ID"]
          key_path = os.environ["KEY_PATH"]
          json_path = os.environ["JSON_PATH"]
          data = {
            "key_id": key_id,
            "issuer_id": issuer_id,
            "key_filepath": key_path,
            "in_house": False,
          }
          with open(json_path, "w", encoding="utf-8") as f:
            json.dump(data, f)
          PY

          echo "ASC_API_KEY_PATH=$JSON_PATH" >> "$GITHUB_ENV"

      - name: Install Ruby gems (Fastlane)
        run: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Upload to TestFlight via Fastlane (Match readonly + Pilot)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_PATH: ${{ env.ASC_API_KEY_PATH }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta
