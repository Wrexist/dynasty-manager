name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Marketing version, e.g. 1.0.11. Leave blank to use package.json (currently 1.0.10).'
        required: false
        type: string
        default: ''

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: Trust GitHub SSH host key
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Override marketing version (only when input is set)
        if: github.event.inputs.marketing_version != ''
        run: npm version ${{ github.event.inputs.marketing_version }} --no-git-tag-version --allow-same-version

      - name: Stamp build number from run number
        run: |
          FILE=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" "$FILE"

      - run: npm ci

      # Fold any pending bullets in src/data/pendingNews.ts into a fresh
      # top entry on src/data/whatsNew.ts. Idempotent — if the current
      # package.json version is already sealed, this is a no-op. The
      # mutation lives only on the runner; we don't commit it back to main.
      - name: Seal pending What's New into whatsNew.ts
        run: npm run whats-new:seal

      # Validate the now-top entry and stamp it with the real CFBundleVersion.
      - name: Validate + stamp What's New build number
        run: node scripts/check-whats-new.mjs --inject-build ${{ github.run_number }}

      - name: Build web bundle with production keys
        env:
          VITE_REVENUECAT_API_KEY: ${{ secrets.VITE_REVENUECAT_API_KEY }}
        run: npm run build

      - name: Sync marketing version from package.json into iOS project
        run: npm run version:sync

      - run: npx cap sync ios

      - name: Strip alpha channel from App Store icon
        run: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -s format jpeg -s formatOptions 100 "$ICON" --out "$ICON.jpg"
          sips -s format png "$ICON.jpg" --out "$ICON"
          rm -f "$ICON.jpg"

      - name: Deploy to TestFlight
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:     ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL:  ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios beta
