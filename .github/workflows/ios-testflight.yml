name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Marketing version, e.g. 1.0.12. Leave blank to use the version in package.json. Must be >= the latest entry in src/data/whatsNew.ts or the build will fail loudly.'
        required: false
        type: string
        default: ''
      dev_tools:
        description: 'Include the in-app Developer section (Reset Pro & open paywall, etc.) for internal testing. Leave OFF for real App Store releases.'
        required: false
        type: boolean
        default: false

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: Trust GitHub SSH host key
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Override marketing version (only when input is set)
        if: github.event.inputs.marketing_version != ''
        run: npm version ${{ github.event.inputs.marketing_version }} --no-git-tag-version --allow-same-version

      - name: Stamp build number from run number
        run: |
          FILE=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" "$FILE"

      - run: npm ci

      # Print the resolved marketing version + build number prominently so
      # operators can sanity-check what's about to ship from the run summary.
      - name: Echo resolved version and build number
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "::notice::Shipping marketing_version=${PKG_VERSION} build=${{ github.run_number }}"
          echo "Marketing version: ${PKG_VERSION}"
          echo "Build number:      ${{ github.run_number }}"

      # Fail fast if the resolved marketing version is lower than the most
      # recently sealed entry in whatsNew.ts. This catches the silent-regression
      # bug where a TestFlight upload lands on an older version train and
      # disappears from the user's TestFlight view.
      - name: Guard against marketing version regression
        run: node scripts/check-marketing-version.mjs

      # Fold any pending bullets in src/data/pendingNews.ts into a fresh
      # top entry on src/data/whatsNew.ts. Idempotent — if the current
      # package.json version is already sealed, this is a no-op. The
      # mutation lives only on the runner; we don't commit it back to main.
      - name: Seal pending What's New into whatsNew.ts
        run: npm run whats-new:seal

      # Validate the now-top entry and stamp it with the real CFBundleVersion.
      - name: Validate + stamp What's New build number
        run: node scripts/check-whats-new.mjs --inject-build ${{ github.run_number }}

      # Surfaces a missing observability secret in the run log. Warn-only until
      # the secrets exist (a fatal check would block every build today); flip
      # to `--strict-sentry` once VITE_SENTRY_DSN is set — see runbook §4.
      - name: Check observability secrets
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: node scripts/check-observability.mjs

      - name: Build web bundle with production keys
        env:
          VITE_REVENUECAT_API_KEY: ${{ secrets.VITE_REVENUECAT_API_KEY }}
          VITE_REVENUECAT_API_KEY_IOS: ${{ secrets.VITE_REVENUECAT_API_KEY_IOS }}
          # Observability: only Sentry now (analytics travels via RC/ASC —
          # see docs/growth-overhaul-plan.md §1.2). Sentry DSN is optional at
          # build time; if missing, the SDK no-ops silently.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Opt-in per-run: exposes the in-app Developer section. Only true when
          # the workflow is dispatched with dev_tools checked — real releases
          # (blank/false) ship without it.
          VITE_DEV_TOOLS: ${{ github.event.inputs.dev_tools }}
        run: npm run build

      # Upload source maps to Sentry BEFORE they are stripped below (the strip
      # exists because cap sync would otherwise ship ~35 MB of maps in the
      # bundle). Skipped when SENTRY_AUTH_TOKEN is absent so the build stays
      # green until the token + org/project are configured — but until then,
      # Sentry stack traces stay minified. The release id must match the SDK's
      # `dynasty-manager@<version>` (src/utils/sentry.ts).
      - name: Upload source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          npx --yes @sentry/cli sourcemaps inject ./dist
          npx --yes @sentry/cli sourcemaps upload ./dist --release "dynasty-manager@$(node -p "require('./package.json').version")"

      # `sourcemap: 'hidden'` still WRITES .map files, and Capacitor's webDir is
      # `dist`, so `cap sync` would copy ~35 MB of readable source maps into the
      # app bundle. Strip them before the sync, never after.
      - name: Strip source maps before native sync
        run: npm run strip-sourcemaps

      - name: Sync marketing version from package.json into iOS project
        run: npm run version:sync

      - run: npx cap sync ios

      - name: Strip alpha channel from App Store icon
        run: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -s format jpeg -s formatOptions 100 "$ICON" --out "$ICON.jpg"
          sips -s format png "$ICON.jpg" --out "$ICON"
          rm -f "$ICON.jpg"

      - name: Deploy to TestFlight
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:     ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL:  ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios beta
