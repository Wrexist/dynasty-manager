name: iOS TestFlight Deploy
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Validate required secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          missing=0
          check_secret() {
            if [ -z "${!1}" ]; then
              echo "::error::Missing secret: $1 — $2"
              missing=$((missing + 1))
            fi
          }

          echo "Checking required secrets..."

          check_secret "APPLE_CERTIFICATE_BASE64" \
            "Base64-encoded .p12 distribution certificate"
          check_secret "APPLE_CERTIFICATE_PASSWORD" \
            "Password for the .p12 certificate"
          check_secret "APPLE_PROVISIONING_PROFILE" \
            "Base64-encoded App Store provisioning profile (.mobileprovision)"
          check_secret "APPLE_TEAM_ID" \
            "Apple Developer Team ID (10-character string)"
          check_secret "ASC_API_KEY_ID" \
            "App Store Connect API Key ID (create at appstoreconnect.apple.com/access/integrations/api)"
          check_secret "ASC_ISSUER_ID" \
            "App Store Connect Issuer ID (found at appstoreconnect.apple.com/access/integrations/api)"
          check_secret "ASC_API_KEY_BASE64" \
            "Base64-encoded App Store Connect API private key (.p8 file)"

          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing required secret(s) missing. Add them at: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required secrets are configured."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run version:sync
      - run: npx cap sync ios

      - name: Strip alpha channel from app icon
        run: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -s format jpeg -s formatOptions 100 "$ICON" --out "$ICON.jpg"
          sips -s format png "$ICON.jpg" --out "$ICON"
          rm -f "$ICON.jpg"
          echo "Alpha channel removed from app icon"

      - name: Set build number from run number
        run: |
          FILE=ios/App/App.xcodeproj/project.pbxproj
          BUILD=${{ github.run_number }}
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD};/g" "$FILE"
          echo "Build number set to: $BUILD"

      - name: Import certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Import provisioning profile
        env:
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build archive
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain"

      - name: Set up App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          echo "$ASC_API_KEY" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if [ ! -s "$KEY_FILE" ]; then
            echo "::error::API key file is empty or was not written"
            exit 1
          fi
          echo "API key written to $KEY_FILE"

      - name: Export & Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.dynastymanager</key>
              <string>Dynasty Manager App Store</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
