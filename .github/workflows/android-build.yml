name: Android Build
on:
  workflow_dispatch:
    inputs:
      # Blank = this workflow's run number, which only ever increases, so Play
      # never sees a reused code. Set it only to jump past a code Play already
      # holds (e.g. a hand-uploaded build numbered higher than the run count).
      version_code:
        description: 'Version code. Leave blank to use the run number. Must be higher than every code already on Play.'
        required: false
        type: string
        default: ''
      play_track:
        description: 'Upload the AAB to this Google Play track. "none" = artifact only (use for the first, hand-uploaded build).'
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - none
      play_release_status:
        description: 'Play release status. "draft" only while the app has never been rolled out anywhere.'
        required: true
        type: choice
        default: completed
        options:
          - completed
          - draft
      # Blank by default, NOT a literal. The old default was '1.0.0', so a
      # dispatch that accepted the form as-is built a 1.0.0 AAB whatever
      # package.json said — the same class of bug as TestFlight build #142,
      # where a stale version landed on an older release train.
      version_name:
        description: 'Version name, e.g. 1.6.1. Leave blank to use the version in package.json. Must be >= the latest entry in src/data/whatsNew.ts or the build will fail loudly.'
        required: false
        type: string
        default: ''

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Fail in seconds, not after a 30-minute preflight, when an upload is
      # asked for but cannot happen.
      - name: Check Play upload credentials
        if: inputs.play_track != 'none'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::play_track is "${{ inputs.play_track }}" but the PLAY_SERVICE_ACCOUNT_JSON secret is not set. Add it (docs/android-launch.md §6b) or re-run with play_track = none.'
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Override version name (only when input is set)
        if: inputs.version_name != ''
        env:
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
        run: |
          if [[ ! "$VERSION_NAME_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Version name must have the form 1.6.0'
            exit 1
          fi
          npm version "$VERSION_NAME_INPUT" --no-git-tag-version --allow-same-version

      - run: npm ci

      # One source for the version name: package.json (already overridden on
      # the runner above when the input was set). Gradle reads VERSION_NAME.
      - name: Resolve version name and code
        env:
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE="${VERSION_CODE_INPUT:-${{ github.run_number }}}"
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Version code must be a positive integer, got '${VERSION_CODE}'"
            exit 1
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "::notice::Building version_name=${VERSION_NAME} version_code=${VERSION_CODE} play_track=${{ inputs.play_track }}"

      # Same guard as the iOS workflow: refuse a version name older than the
      # most recently sealed entry in src/data/whatsNew.ts.
      - name: Guard against marketing version regression
        run: node scripts/check-marketing-version.mjs

      - name: Validate release candidate
        run: npm run preflight:full

      # Same as the iOS workflow: fold src/data/pendingNews.ts into a fresh top
      # entry of src/data/whatsNew.ts (a no-op when this version is already
      # sealed), so the AAB's in-app What's New shows this release rather than
      # the previous one. Runner-only — never committed back to main.
      - name: Seal pending What's New into whatsNew.ts
        run: npm run whats-new:seal

      # Validate the now-top entry and stamp it with this build's versionCode
      # (the Android counterpart of the iOS CFBundleVersion stamp).
      - name: Validate + stamp What's New build number
        run: node scripts/check-whats-new.mjs --inject-build ${{ env.VERSION_CODE }}

      - name: Build web bundle with production keys
        env:
          VITE_REVENUECAT_API_KEY_ANDROID: ${{ secrets.VITE_REVENUECAT_API_KEY_ANDROID }}
          # Observability: only Sentry now (analytics travels via RC/ASC).
          # Gated on the same SENTRY_ENABLED variable as the iOS build: the
          # privacy policy says Sentry is off, and a DSN secret that exists
          # for later must not switch it on for Android alone.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_ENABLED == 'true' && secrets.VITE_SENTRY_DSN || '' }}
          # Optional. Unset or shorter than MIN_REDEEM_SECRET_LENGTH leaves
          # redeem codes disabled and the Settings entry hidden
          # (utils/redeemCodes.ts getRedeemSecret).
          VITE_REDEEM_SECRET: ${{ secrets.VITE_REDEEM_SECRET }}
        run: npm run build
      # `sourcemap: 'hidden'` still WRITES .map files, and Capacitor's webDir is
      # `dist`, so `cap sync` would copy ~35 MB of readable source maps into the
      # app bundle. Strip them before the sync, never after.
      - name: Strip source maps before native sync
        run: npm run strip-sourcemaps

      - run: npm run version:sync
      - run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/dynasty-manager.keystore

      - name: Build signed release AAB
        env:
          KEYSTORE_FILE: dynasty-manager.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynasty-manager-release
          path: android/app/build/outputs/bundle/release/*.aab

      # Upload after the artifact step, so a failed upload still leaves the
      # AAB downloadable for a manual Console upload.
      - uses: ruby/setup-ruby@v1
        if: inputs.play_track != 'none'
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Upload to Google Play (${{ inputs.play_track }})
        if: inputs.play_track != 'none'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.play_track }}
          PLAY_RELEASE_STATUS: ${{ inputs.play_release_status }}
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
        run: bundle exec fastlane android upload
